# ??????????????????????????????????????????????????????????????????????
# SERVER & APPLICATION
# ??????????????????????????????????????????????????????????????????????
spring.application.name=WEBBANKING
server.port=8081

# ??????????????????????????????????????????????????????????????????????
# DATASOURCE ? SQL Server (BankingEconomy)
# ??????????????????????????????????????????????????????????????????????
# S? d?ng tên server DESKTOP-5CVC0H1 và DB BankingEconomy c?a b?n
spring.datasource.url=jdbc:sqlserver://DESKTOP-5CVC0H1:1433;databaseName=BankingEconomy;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Postgres123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ??????????????????????????????????????????????????????????????????????
# KAFKA (C?u hình chi ti?t cho JSON)
# ??????????????????????????????????????????????????????????????????????
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=banking-group
spring.kafka.consumer.auto-offset-reset=earliest

# C?u hình Serializer/Deserializer ?? truy?n nh?n ??i t??ng JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ??????????????????????????????????????????????????????????????????????
