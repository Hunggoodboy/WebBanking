global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'account-service'
    static_configs:
      - targets: ['account-service:8081']
    metrics_path: '/actuator/prometheus'

  - job_name: 'transfer-service'
    static_configs:
      - targets: ['transfer-service:8082']
    metrics_path: '/actuator/prometheus'